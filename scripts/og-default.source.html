<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'PJ'; src: local('Plus Jakarta Sans'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    background:#FAFAF7;
    color:#141414;
    position:relative;
    overflow:hidden;
  }
  /* Left orange spine — the single signature accent */
  .spine { position:absolute; left:0; top:0; bottom:0; width:14px; background:#F05A28; }
  .wrap { position:absolute; inset:0; padding:72px 80px 64px 96px; display:flex; flex-direction:column; }
  .eyebrow {
    font-family:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;
    font-size:20px; letter-spacing:0.22em; text-transform:uppercase;
    color:#C94A1A; font-weight:600;
  }
  .brand { margin-top:22px; font-size:60px; font-weight:800; letter-spacing:-0.02em; color:#141414; }
  .brand .jet { color:#F05A28; }
  .headline {
    margin-top:auto; font-size:74px; line-height:1.03; font-weight:800; letter-spacing:-0.03em;
    max-width:940px; color:#141414;
  }
  .sub { margin-top:26px; font-size:27px; font-weight:500; color:#4A4A48; letter-spacing:-0.01em; }
  .chips { margin-top:34px; display:flex; gap:14px; }
  .chip {
    font-size:21px; font-weight:600; color:#141414;
    border:1.5px solid #E4E2DA; background:#fff; border-radius:999px; padding:11px 22px;
  }
  .chip .dot { color:#F05A28; font-weight:800; }
</style>
</head>
<body>
  <div class="spine"></div>
  <div class="wrap">
    <div class="eyebrow">factoryjet.com</div>
    <div class="brand">Factory<span class="jet">Jet</span></div>

    <div class="headline">Omnichannel commerce, built to scale.</div>
    <div class="sub">DTC &amp; B2B on Shopify Plus, Magento &amp; headless. Plus web design, AI agents &amp; AI SEO.</div>
    <div class="chips">
      <div class="chip"><span class="dot">500+</span> projects</div>
      <div class="chip">DTC &amp; B2B commerce</div>
      <div class="chip">US &middot; UK &middot; India</div>
    </div>
  </div>
</body>
</html>
